name: Roll back production updater

on:
  workflow_dispatch:
    inputs:
      image_ref:
        description: Previous immutable updater image ending in @sha256:<digest>
        required: true
      confirmation:
        description: Type ROLLBACK-PRODUCTION
        required: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: offline-wiki-updater-production
  cancel-in-progress: false

jobs:
  rollback:
    if: ${{ inputs.confirmation == 'ROLLBACK-PRODUCTION' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate immutable image
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
        run: '[[ "$IMAGE_REF" =~ ^ghcr\.io/.+@sha256:[0-9a-f]{64}$ ]]'
      - name: Request GitHub OIDC token
        id: oidc
        env:
          AUDIENCE: ${{ vars.DEPLOY_BROKER_AUDIENCE }}
        run: |
          set -euo pipefail
          response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}")"
          printf 'token=%s\n' "$(printf '%s' "$response" | jq -r .value)" >> "$GITHUB_OUTPUT"
      - name: Redeploy previous image without changing persistent data
        env:
          BROKER_URL: ${{ vars.DEPLOY_BROKER_URL }}
          APP_ID: ${{ vars.DEPLOY_BROKER_APP_ID }}
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          IMAGE_REF: ${{ inputs.image_ref }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID }}
          OAUTH_ALLOWED_USERS: ${{ vars.OAUTH_ALLOWED_USERS }}
          OAUTH_CLIENT_SECRET: ${{ secrets.OAUTH_CLIENT_SECRET }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          RUNTIME_VARS: ${{ toJSON(vars) }}
        run: |
          set -euo pipefail
          runtime_env="$(jq -n --argjson vars "$RUNTIME_VARS" \
            --arg oauth_id "$OAUTH_CLIENT_ID" --arg oauth_users "$OAUTH_ALLOWED_USERS" \
            --arg oauth_secret "$OAUTH_CLIENT_SECRET" --arg session "$SESSION_SECRET" \
            '$vars | {APP_ENV,BIND_HOST,DATA_DIR,DATABASE_PATH,WORKER_ENABLED,BUILDER_ENABLED,ENABLED,ENABLED_LANGUAGES,STORAGE_LIMIT_GB,MIN_FREE_GB,SNAPSHOT_RETENTION,TIMEZONE,HTTP_CONCURRENCY,PAGE_CONCURRENCY,USER_AGENT} + {OAUTH_CLIENT_ID:$oauth_id,OAUTH_ALLOWED_USERS:$oauth_users,OAUTH_CLIENT_SECRET:$oauth_secret,SESSION_SECRET:$session}')"
          body="$(jq -n --arg oidc_token "$OIDC_TOKEN" --arg image "$IMAGE_REF" \
            --arg ghcr_username "${{ github.repository_owner }}" --arg ghcr_token "$GHCR_TOKEN" \
            --argjson runtime_env "$runtime_env" \
            '{oidc_token:$oidc_token,image:$image,ghcr_username:$ghcr_username,ghcr_token:$ghcr_token,runtime_env:$runtime_env}')"
          curl -fsSL -X POST "$BROKER_URL/api/deployments/$APP_ID" -H 'Content-Type: application/json' -d "$body"
          echo "Rolled back application image to \`$IMAGE_REF\`; persistent /data was preserved." >> "$GITHUB_STEP_SUMMARY"
