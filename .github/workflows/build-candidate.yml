name: Build v1.3.0 release draft

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BUILD-RELEASE after approving the full candidate
        required: true
      build_scope:
        description: Select which platform builds to run
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows

permissions:
  contents: write
  packages: read

concurrency:
  group: offline-wiki-release-v1.3.0
  cancel-in-progress: false

jobs:
  prepare-release:
    if: ${{ inputs.confirmation == 'BUILD-RELEASE' }}
    runs-on: ubuntu-latest
    environment: release
    outputs:
      version: ${{ steps.lock.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - id: lock
        env:
          CONFIGURED_VERSION: ${{ vars.RELEASE_VERSION }}
          CONFIGURED_SNAPSHOT_REF: ${{ vars.RELEASE_SNAPSHOT_REF }}
        run: |
          set -euo pipefail
          version="$(jq -r .version content-lock.json)"
          snapshot_ref="$(jq -r .oci_ref content-lock.json)"
          test "$version" = "$CONFIGURED_VERSION"
          test "$snapshot_ref" = "$CONFIGURED_SNAPSHOT_REF"
          [[ "$snapshot_ref" =~ @sha256:[0-9a-f]{64}$ ]]
          test "$(jq -r .validation.broken_links content-lock.json)" = 0
          test "$(jq -r .validation.missing_assets content-lock.json)" = 0
          test "$(jq -r .validation.remote_resources content-lock.json)" = 0
          test "$(jq -r .version desktop/content-release.json)" = "$version"
          test "$(jq -r .archive_sha256 desktop/content-release.json)" = "$(jq -r .archive_sha256 content-lock.json)"
          test "$(jq -r .snapshot_id desktop/content-release.json)" = "$(jq -r .snapshot_id content-lock.json)"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Create or reset protected draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.lock.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            test "$(gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
            gh release edit "$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
            if ! gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq content-release.json; then
              gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
                while IFS= read -r asset; do
                  test -z "$asset" || gh release delete-asset "$VERSION" "$asset" --repo "$GITHUB_REPOSITORY" --yes
                done
              echo "Removed legacy language-specific assets from $VERSION."
            fi
          else
            gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --draft \
              --target "$GITHUB_SHA" --title "Offline Stardew Valley Wiki $VERSION" \
              --notes-file release/notes-introduction.md --generate-notes
          fi
      - name: Download, verify and attach approved content
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.lock.outputs.version }}
        run: |
          set -euo pipefail
          snapshot_ref="$(jq -r .oci_ref content-lock.json)"
          archive_name="$(jq -r .archive_name content-lock.json)"
          mkdir snapshot
          for attempt in 1 2 3; do
            docker pull ghcr.io/oras-project/oras:v1.3.0 && break
            test "$attempt" -lt 3 || exit 1
            sleep "$((attempt * 10))"
          done
          docker run --pull=never --rm -v "$PWD:/workspace" -w /workspace ghcr.io/oras-project/oras:v1.3.0 \
            pull "$snapshot_ref" -o snapshot
          mapfile -t archives < <(find snapshot -type f -name "$archive_name" -print)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          test "$(stat -c %s "$archive")" -eq "$(jq -r .archive_bytes desktop/content-release.json)"
          printf '%s  %s\n' "$(jq -r .archive_sha256 content-lock.json)" "$archive" | sha256sum --check --status
          sha256sum "$archive" | sed 's#  .*/#  #' > SHA256SUMS-content
          gh release upload "$VERSION" "$archive" desktop/content-release.json SHA256SUMS-content \
            --repo "$GITHUB_REPOSITORY" --clobber

  linux:
    needs: prepare-release
    if: ${{ inputs.build_scope == 'all' || inputs.build_scope == 'linux' }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies and cache Electron runtime
        run: |
          set -euo pipefail
          npm ci
          for attempt in 1 2 3; do
            node -e "require('@electron/get').downloadArtifact({version:require('electron/package.json').version,artifactName:'electron',platform:process.platform,arch:'x64'}).then(console.log)" && break
            test "$attempt" -lt 3 || exit 1
            sleep "$((attempt * 10))"
          done
      - name: Build and upload lightweight Linux app
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y fakeroot rpm
          npm run make:linux
          mapfile -t assets < <(find out/make -type f \( -name '*.zip' -o -name '*.deb' -o -name '*.rpm' \) -print)
          test "${#assets[@]}" -eq 3
          for asset in "${assets[@]}"; do test "$(stat -c %s "$asset")" -lt 2147483648; done
          for asset in "${assets[@]}"; do sha256sum "$asset"; done | sed 's#  .*/#  #' > SHA256SUMS-app-linux
          gh release upload "$VERSION" "${assets[@]}" SHA256SUMS-app-linux --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    needs: prepare-release
    if: ${{ inputs.build_scope == 'all' || inputs.build_scope == 'windows' }}
    runs-on: windows-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies and cache Electron runtime
        shell: pwsh
        run: |
          npm ci
          foreach ($attempt in 1..3) {
            try {
              node -e "require('@electron/get').downloadArtifact({version:require('electron/package.json').version,artifactName:'electron',platform:process.platform,arch:'x64'}).then(console.log)"
              if ($LASTEXITCODE -ne 0) { throw "Electron download exited with $LASTEXITCODE." }
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds ($attempt * 10)
            }
          }
      - name: Build and upload lightweight Windows app
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          npm run make:windows
          $portable = @(Get-ChildItem out/make -Recurse -File -Filter '*.zip' |
            Where-Object { $_.FullName -notmatch 'squirrel\.windows' })
          $setup = @(Get-ChildItem out/make -Recurse -File -Filter '*setup.exe')
          $assets = @($portable + $setup)
          if ($portable.Count -ne 1 -or $setup.Count -ne 1 -or $assets.Count -ne 2) {
            throw "Expected one portable ZIP and one Setup.exe; found $($assets.Count) files."
          }
          foreach ($asset in $assets) { if ($asset.Length -ge 2GB) { throw "$($asset.Name) exceeds 2 GiB." } }
          $assets | ForEach-Object {
            "$(($_ | Get-FileHash -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content SHA256SUMS-app-windows
          gh release upload $env:VERSION @($assets.FullName) SHA256SUMS-app-windows --repo $env:GITHUB_REPOSITORY --clobber

  finalize-draft:
    needs: [prepare-release, linux, windows]
    if: >-
      ${{
        always() &&
        needs.prepare-release.result == 'success' &&
        (needs.linux.result == 'success' || needs.linux.result == 'skipped') &&
        (needs.windows.result == 'success' || needs.windows.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Consolidate checksums and attach metadata
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare-release.outputs.version }}
        run: |
          set -euo pipefail
          mkdir checksums
          gh release download "$VERSION" --repo "$GITHUB_REPOSITORY" --pattern 'SHA256SUMS-*' --dir checksums
          cat checksums/SHA256SUMS-* | sort -k2 > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 6
          gh release upload "$VERSION" SHA256SUMS content-lock.json desktop/content-release.json \
            release/validation-report-v1.3.0.json --repo "$GITHUB_REPOSITORY" --clobber
          {
            echo "Draft $VERSION is ready for manual testing."
            echo "It contains five lightweight application packages and one verified content snapshot."
          } >> "$GITHUB_STEP_SUMMARY"
