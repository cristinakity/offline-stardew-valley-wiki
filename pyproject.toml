[project]
name = "offline-stardew-valley-wiki-updater"
version = "0.1.0"
description = "Local-first MediaWiki synchronizer and release dashboard"
requires-python = ">=3.13"
dependencies = [
  "apscheduler==3.11.0",
  "beautifulsoup4==4.13.4",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "pydantic-settings==2.10.1",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[project.scripts]
wiki-updater = "wiki_updater.cli:main"

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wiki_updater*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

